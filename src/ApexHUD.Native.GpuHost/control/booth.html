<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandstand Booth</title>
<style>
  :root { --bg: #05070e; --panel: #0b1222; --line: rgba(197,165,114,.18); --gold: #c5a572; --gold-hi: #ffd876; --ivory: #ecf4f7; --mut: rgba(236,244,247,.6); --up: #2ec47a; --down: #e04f5b; --purple: #9b5cff; --live: #e0303b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ivory); font: 14px/1.35 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 3; display: flex; gap: 22px; align-items: baseline; padding: 12px 18px; background: linear-gradient(180deg, #0e1628, #080d1a); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-size: 20px; letter-spacing: .04em; }
  .k { color: var(--gold); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; margin-right: 6px; }
  .flag { padding: 2px 8px; font-weight: 700; font-size: 12px; letter-spacing: .1em; }
  .flag.GREEN { background: #19c46b; color: #021; } .flag.CAUTION, .flag.WHITE { background: #f2c230; color: #210; } .flag.RED { background: #e0303b; } .flag.CHEQUERED { background: #fff; color: #000; }
  .onair { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 10px 18px; background: #0a0f1d; border-bottom: 1px solid var(--line); font-size: 15px; }
  .onair .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 10px var(--live); display: inline-block; margin-right: 8px; }
  .onair b { color: var(--gold-hi); }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 14px; padding: 14px 18px 0; }
  @media (max-width: 1150px) { .top { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
  h2 { margin: 0; padding: 10px 14px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); color: var(--gold); }
  h2 i { width: 10px; height: 10px; display: inline-block; }
  .stories { list-style: none; margin: 0; padding: 0; }
  .stories li { display: flex; gap: 14px; align-items: baseline; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.06); font-size: 19px; line-height: 1.3; }
  .stories li:first-child { border-top: 0; }
  .stories li.hot { font-size: 25px; font-weight: 600; background: rgba(197,165,114,.08); }
  .stories li.hot:first-child { font-size: 28px; }
  .stories .cls { flex: none; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--line); color: var(--gold); position: relative; top: -3px; }
  .cards { list-style: none; margin: 0; padding: 0; }
  .cards > li { padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.06); }
  .cards > li:first-child { border-top: 0; }
  .cards .t { font-size: 17px; font-weight: 700; color: var(--gold-hi); }
  .cards .t small { color: var(--mut); font-weight: 400; font-size: 12px; letter-spacing: .08em; margin-left: 8px; text-transform: uppercase; }
  .cards ul { margin: 6px 0 0; padding-left: 18px; color: var(--ivory); font-size: 15px; }
  .cards ul li { margin: 3px 0; }
  .why { color: var(--mut); font-size: 12px; padding: 8px 14px; border-top: 1px solid rgba(255,255,255,.06); }
  .fieldwrap { padding: 0 18px 14px; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); font-weight: 600; padding: 6px 8px; white-space: nowrap; }
  td { padding: 6px 8px; border-top: 1px solid rgba(255,255,255,.05); white-space: nowrap; }
  tr.cam td { background: rgba(197,165,114,.10); }
  td.pos { color: var(--gold-hi); font-weight: 700; width: 32px; }
  td.name { font-weight: 600; } td.name small { color: var(--mut); font-weight: 400; margin-left: 6px; }
  .purple { color: var(--purple); font-weight: 700; } .pit { color: #f2c230; font-weight: 700; }
  .up { color: var(--up); } .down { color: var(--down); }
  .wait { padding: 30px; text-align: center; color: var(--mut); }
</style>
</head>
<body>
<header>
  <b id="track">Grandstand Booth</b>
  <span><span class="k">Session</span><span id="session">-</span></span>
  <span><span class="k">Lap</span><span id="lap">-</span></span>
  <span><span class="k">Left</span><span id="left">-</span></span>
  <span id="flag" class="flag"></span>
  <span><span class="k">Air / Track</span><span id="temps">-</span></span>
</header>
<div class="onair"><span><span class="dot"></span><span class="k">On air</span><span id="oa">-</span></span></div>
<div class="top">
  <section><h2>Storylines</h2><ul class="stories" id="stories"><li class="wait">Nothing yet</li></ul></section>
  <section><h2>Coming up on screen</h2><ul class="cards" id="cards"><li class="wait">Nothing waiting</li></ul><div class="why" id="why"></div></section>
</div>
<div class="fieldwrap" id="classes"><div class="wait">Waiting for Grandstand...</div></div>
<script>
(() => {
  "use strict";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (id) => document.getElementById(id);
  let unit = "F";
  const temp = (c) => unit === "F" ? Math.round(c * 9 / 5 + 32) + "°F" : Math.round(c) + "°C";
  const notes = (n) => (n && n.length) ? `<ul>${n.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  function render(d) {
    $("track").textContent = d.track || "Grandstand Booth";
    $("session").textContent = d.session || "-";
    $("lap").textContent = d.total > 0 && d.total < 2000 ? `${d.lap} / ${d.total}` : (d.lap || "-");
    $("left").textContent = d.left || "-";
    const f = $("flag"); f.className = "flag " + (d.flag || ""); f.textContent = d.flag || "";
    $("temps").textContent = d.live ? `${temp(d.air)} / ${temp(d.trackTemp)}${d.rain ? " · RAIN" : ""}` : "-";
    const oa = d.onAir || {};
    const bits = [];
    if (oa.camera) bits.push(`<span class="k">Camera</span><b>${esc(oa.camera)}</b>`);
    if (oa.card) bits.push(`<span class="k">Card</span><b>${esc(oa.card)}</b>`);
    if (oa.tag) bits.push(`<span class="k">Tag</span>${esc(oa.tag)}`);
    $("oa").innerHTML = bits.length ? bits.join("&nbsp;&nbsp;&nbsp;") : "-";
    const st = d.stories || [];
    $("stories").innerHTML = st.length ? st.map((s, i) => `<li class="${s.w >= 8 || i < 2 ? "hot" : ""}"><span class="cls">${esc(s.cls)}</span><span>${esc(s.text)}</span></li>`).join("") : `<li class="wait">Nothing yet</li>`;
    const cards = [];
    if (oa.card) cards.push(`<li><div class="t">${esc(oa.card)}<small>on screen now</small></div>${notes(oa.notes)}</li>`);
    (d.upNext || []).forEach((c, i) => cards.push(`<li><div class="t">${esc(c.card)}<small>${c.next ? "next in rotation" : i === 0 ? "next up" : "waiting"}</small></div>${notes(c.notes)}</li>`));
    $("cards").innerHTML = cards.length ? cards.join("") : `<li class="wait">Nothing waiting</li>`;
    $("why").textContent = oa.why ? "Cards: " + oa.why : "";
    if (!d.live || !d.cars.length) { $("classes").innerHTML = `<div class="wait">iRacing isn't in a session yet.</div>`; return; }
    const groups = {};
    d.cars.forEach((c) => (groups[c.cls] = groups[c.cls] || { color: c.color, cars: [] }).cars.push(c));
    $("classes").innerHTML = Object.entries(groups).map(([name, g]) => `<section><h2><i style="background:${esc(g.color)}"></i>${esc(name)} <span style="color:var(--mut);font-size:11px;letter-spacing:.08em">${g.cars.length} cars</span></h2><div class="wrap"><table>
      <tr><th>P</th><th>#</th><th>Driver</th><th>Gap</th><th>Int</th><th>Trend</th><th>Last</th><th>Best</th><th>Laps</th><th>Stint</th><th>Stops</th><th>Last stop</th><th>+/-</th><th>iR</th><th>Inc</th></tr>
      ${g.cars.map((c) => `<tr class="${c.idx === d.camera ? "cam" : ""}"><td class="pos">${c.pos}</td><td>${esc(c.num)}</td>
        <td class="name">${esc(c.name)}${c.team ? `<small>${esc(c.team)}</small>` : ""}${c.inPit ? ` <span class="pit">PIT</span>` : ""}</td>
        <td>${esc(c.gap)}</td><td>${esc(c.interval)}</td>
        <td class="${c.trend == null ? "" : c.trend < 0 ? "up" : "down"}">${c.trend == null ? "" : (c.trend < 0 ? "▲ " : "▼ ") + Math.abs(c.trend).toFixed(2)}</td>
        <td>${esc(c.last)}</td><td class="${c.classBest ? "purple" : ""}">${esc(c.best)}</td><td>${c.laps}</td><td>${c.stint}</td><td>${c.stops}</td><td>${esc(c.lastStop)}</td>
        <td class="${c.gained > 0 ? "up" : c.gained < 0 ? "down" : ""}">${c.gained > 0 ? "+" + c.gained : c.gained || ""}</td><td>${c.ir || ""}</td><td>${c.inc >= 0 ? c.inc + "x" : ""}</td></tr>`).join("")}
    </table></div></section>`).join("");
  }
  async function tick() {
    try { const r = await fetch("/api/booth", { cache: "no-store" }); if (r.ok) render(await r.json()); } catch { }
    setTimeout(tick, 1000);
  }
  fetch("/api/settings", { cache: "no-store" }).then((r) => r.json()).then((s) => { if (s.tempUnit === "C") unit = "C"; }).catch(() => {});
  tick();
})();
</script>
</body>
</html>
